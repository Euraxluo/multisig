\* and without the key-threshold floor (:899). Attributes issues #9 and #15 to
\* exactly those two guards — every other action is unchanged.
SPECIFICATION SpecUnguarded
CONSTANTS
    Keys = {K1, K2}
    Nonces = {1, 2, 3}
    Horizons = {0, 1, 2}
INVARIANT
    NoSignerOutsideGovernance
    GovernanceCoversKeyThreshold
CHECK_DEADLOCK FALSE
